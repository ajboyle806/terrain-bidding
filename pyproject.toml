[project]
name = "terrain-bidding"
version = "0.1.0"
description = "Incentive-compatible task allocation for legged robots via uncertainty decomposition"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
sim = [
    "isaacgym",  # installed manually from NVIDIA
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
